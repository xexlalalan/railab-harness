piper:
  ros__parameters:
    can_channel: "can0"
    rate_hz: 100.0
    default_speed_percent: 10
    max_speed_percent: 30          # hard cap this sprint; raise deliberately
    watchdog_s: 0.25               # feedback silence that cancels the goal and latches a fault (the arm stays enabled)
    move_timeout_s: 30.0
    max_joint_delta_rad: 1.2       # one goal may not ask any joint to jump further than this (~70 deg)
    pose_max_joint_delta_rad: 1.2  # (unused since 2026-10-24: a straight line is planned whole; a joint jumping > smooth_knot_jump_rad between knots refuses it)
    joint_tol_rad: 0.01
    pos_tol_m: 0.003
    ang_tol_rad: 0.03
    settle_samples: 5              # consecutive in-tolerance samples at 20 Hz
    workspace_min: [-0.70, -0.70, -0.05]   # arm_base frame, metres (the floor is guarded by the tip check below, not by this box)
    workspace_max: [ 0.70,  0.70,  0.90]
    floor_enabled: true            # from 'ros2 run harness_calibration floor' 2026-09-17: 181 samples, 23x23 cm, rms 2.2 / max 4.8 mm
    floor_plane: [-0.01221, -0.00446, 0.00453]   # base frame z = a*x + b*y + c (m); both 2026-09-18 drags with the 4-parameter wrist model: tilt 0.74 deg, rms 1.74 mm
    tcp_offset_m: 0.1441           # finger set #3, gripper base face -> fingertip, from the floor fit; ruler check welcome
    floor_margin_m: 0.015          # 10 mm requested safe space + 5 mm fit uncertainty; targets closer than this are refused
    gripper_enabled: true
    gripper_max_m: 0.0896          # = gripper_travel_m * gripper_scale
    gripper_inverted: true         # fingers mounted reversed 2026-09-18: motor open = jaws closed
    gripper_travel_m: 0.0896       # raw reading at zero gap; set 2026-09-19 from the operator-set 20.00 mm gap (raw 0.0696); was 0.0967
    gripper_scale: 1.0             # physical gap per raw metre; set from a caliper measurement of the full-open gap
    # the twin's Calibrate gripper (/arm/gripper_calibrate, 2026-10-24) writes travel / scale / max gap here; when the
    # file exists the node uses it instead of the three numbers above
    gripper_calib_file: /home/bunny-harness/bunny-harness-dev/calib/gripper.yaml
    gripper_hold_force: 5.0        # N: /arm/gripper_enable (Hold gripper) grips where the jaws are with this (operator 2026-10-24)
    gripper_force: 1.0
    gripper_tol_m: 0.002
    gripper_timeout_s: 4.0
    # --- corrected kinematic model (2026-09-18): harness FK/IK over the SDK MDH table + joint zero offsets
    kinematics_file: /home/bunny-harness/bunny-harness-dev/calib/kinematics.yaml
    kinematics_model: piper
    ik_limit_margin_rad: 0.02
    linear_step_m: 0.02            # (unused since 2026-10-24: straight lines are smooth, not 20 mm hops)
    linear_step_rad: 0.1
    pose_total_jump_rad: 2.5       # point-to-point move_pose: one smooth joint move up to this jump; beyond = refused
    stall_s: 2.0                   # (unused since 2026-10-24: a joint the controller clamps shows as a tracking error)
    # --- smooth moves (2026-10-24): move_j / move_pose are minimum-jerk trajectories streamed like follow_trajectory.
    # speed_percent scales these peaks (10 % = 0.3 rad/s joints, 50 mm/s and 0.3 rad/s tool); acceleration peak =
    # smooth_acc_per_s x speed peak; joints never above traj_max_joint_vel_rad_s
    smooth_joint_vel_rad_s: 3.0
    smooth_tool_vel_m_s: 0.5
    smooth_tool_vel_rad_s: 3.0
    smooth_acc_per_s: 2.0
    smooth_knot_s: 0.04            # straight lines: IK every 40 ms of the profile, joints interpolated at traj_rate_hz
    smooth_knot_jump_rad: 0.15     # a joint changing more than this between two knots = a wrist flip: refused
    # --- /arm/follow_trajectory (2026-10-22, planner bedrock): streamed joint trajectories
    traj_rate_hz: 100.0            # move_j re-targeted this often while a trajectory runs
    traj_max_joint_vel_rad_s: 0.6  # refuse trajectories faster than this (+10 %) between points; the planner plans to 0.5
    traj_tracking_error_rad: 0.15  # freeze + fail when |measured - commanded| exceeds this on any joint
    traj_start_tol_rad: 0.05       # the first point must be this close to the current joints
    traj_max_points: 20000
    # --- e-stop button (2026-10-24): its normally-closed contact carries the 5 V of this USB mouse (lsusb vendor:product);
    # pressed = the mouse gone = goals cancelled, joints 1-6 held where they are, every command refused until it is out
    # (then ready at once, still holding). An unplugged mouse counts as pressed. "" = no button watched (the node says so at start)
    estop_usb_id: "04f2:1459"      # HP USB Optical Mouse on the hub next to the CAN adapter (USB 1-8.2 on 2026-10-24)
    estop_poll_s: 0.02
