tag_node:
  ros__parameters:
    width: 1280
    height: 720
    fps: 30
    families: ["tag16h5", "tag36h11"]   # one detector per family on every frame (2026-10-24): the lab's tags are 16h5; the Bunny platform's tag 3 is a 36h11 print
    family: "tag16h5"           # (only when `families` is empty)
    tag_size_m: 0.05            # black-square edge of a tag with no entry below (the Bunny's 16h5 tags: 50 mm print, 37.5 black)
    # black-square edge per family and id. 16h5 = printed x 6/8: Bunny 7 (50 mm print), 5 (35.8 by the 2026-09-18 range-scale
    # test; the twin says a 40 mm print = 30 - ruler check pending), holder 2 (30 mm print), 8 = wall tag 34.7 (stereo depth).
    # 36h11 = printed x 8/10: the Bunny platform's tag 3 (2026-10-24, was a 10 mm 16h5 print): a 27.5 mm print (the twin's
    # entry) in the platform's 30.5 mm pocket -> 22 mm black; a ruler check of the black square settles it
    tag_sizes: ["tag16h5:7=0.0375", "tag16h5:5=0.0358", "tag16h5:8=0.0347", "tag16h5:2=0.0225", "tag36h11:3=0.022"]
    center_fraction: 0.3333     # central square side = fraction of image height
    min_size_px: 40             # "set" needs mean edge length within [min, max] px (standoff gate); 40 was for the old 7.5 mm platform tag
    max_size_px: 260
    image_rate_hz: 10.0         # /camera/image/compressed publish rate (with overlay)
    jpeg_quality: 70
    exposure_us: 0              # 0 = auto exposure
    error_correction_rate: 0.0  # exact code match; 16h5 flips IDs (7 -> 5) with the OpenCV default 0.6
